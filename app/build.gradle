plugins { id 'com.android.application' }

android {
    namespace 'dev.pocketcode.app'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.pocketcode.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.11.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
